[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keklab"
version = "0.1.0"
description = "4chan /pol/ NLP pipeline (formal + ingest layers)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "pandas>=2.0",
    "pydantic>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
ingest = ["httpx>=0.27", "tenacity>=8.0"]
formal = ["lark>=1.1"]
dev = ["pytest>=8"]

[project.scripts]
keklab = "keklab.common.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
